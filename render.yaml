services:
  - type: web
    name: alex101-bot-worker
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_WORKER_HOST
        value: 0.0.0.0
      - key: BOT_WORKER_PORT
        value: "4000"
      - key: BOT_WORKER_VIEWER_PORT
        value: "4001"
      - key: BOT_WORKER_CONFIG
        value: /data/settings.json
      - key: BOT_WORKER_SECRET
        sync: false
      - key: DEFAULT_MC_HOST
        value: mc.238458.xyz
      - key: DEFAULT_MC_PORT
        value: "25565"
      - key: DEFAULT_MC_USERNAME
        value: Alex101
      - key: DEFAULT_MC_VERSION
        value: "1.21.11"
      - key: DEFAULT_MC_AUTH
        value: offline
      - key: VIEW_DISTANCE
        value: "6"
      - key: AUTO_CONNECT
        value: "1"
      - key: PORT
        value: "4000"
    disk:
      name: alex101-data
      mountPath: /data
      sizeGB: 1